# Copy to ~/.config/filmare/config.toml. Never commit the copy: it names private things.

# Regexes, matched case-insensitively. Use stems so that case endings are caught.
names = ["Alice\\w*", "Алис\\w*"]

# Files with one private string per line: addresses, hotels, client names.
deny_text = ["~/.config/filmare/private.txt"]

# JSON files to harvest. Values under keys such as name, address and title become private.
deny_json = ["~/projects/my-app/data/*.json"]

# Extra keys to harvest from those files.
deny_keys = []

# Words to show even when harvesting finds them, such as the city you openly talk about.
allow = []

# Show code diffs in the video. When false, every edit shows "[code hidden]".
# JSON, .env, key files and anything under data/, fixtures/, secrets/ or memory/ stay hidden either way.
show_code = false

# How much of each message to show, in characters. Longer ones are cut at a sentence.
say_limit = 280
