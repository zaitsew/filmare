<defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3A4AA8" stop-opacity=".22"/><stop offset="1" stop-color="#3A4AA8" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#card)">
<circle cx="800" cy="125.0" r="170" fill="url(#glow)"/>
