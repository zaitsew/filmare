<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Filmare. Agent sessions as video. Nothing private leaves. Renders Claude Code and Codex logs as terminal clips, or refuses to export. Building, CLI, macOS, Open source, Free to run.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161D}.m{fill:#585E6D}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="249" rx="12" fill="#FFFFFF" stroke="#DCDEE5"/>
