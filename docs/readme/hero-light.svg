<rect x="772" y="97.0" width="56" height="56" rx="16" fill="#3A4AA8" fill-opacity=".24" transform="rotate(12 800 125.0)"/>
</g>
<rect x="40" y="54" width="72" height="72" rx="16" fill="#3A4AA8"/>
<text x="76" y="102" font-size="34" text-anchor="middle" class="b" style="fill:#FFFFFF">F</text>
<text class="b" x="136" y="86" font-size="40">Filmare</text>
<text x="136" y="122" font-size="19">Agent sessions as video. Nothing private leaves.</text>
<text class="m" x="136" y="150" font-size="14">Renders Claude Code and Codex logs as terminal clips, or refuses to export.</text>
