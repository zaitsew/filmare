<svg xmlns="http://www.w3.org/2000/svg" width="880" height="169" viewBox="0 0 880 169" role="img" aria-label="How it works. 1. Read the log. Your agent already wrote it. 2. Sanitize. Copy only what is known safe. 3. Render. An animated terminal clip. 4. Pass 3 gates. Text, layout, then OCR. 5. Export. Video plus contact sheet.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161D}.m{fill:#585E6D}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="168" rx="12" fill="#FFFFFF" stroke="#DCDEE5"/>
<line x1="90.0" x2="190.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="60.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="60.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">1</text>
<text class="b" x="40.0" y="98" font-size="15.5">Read the log</text>
<text class="m" x="40.0" y="120" font-size="13.5">Your agent already</text>
<text class="m" x="40.0" y="139" font-size="13.5">wrote it.</text>
<line x1="250.0" x2="350.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="220.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="220.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">2</text>
<text class="b" x="200.0" y="98" font-size="15.5">Sanitize</text>
<text class="m" x="200.0" y="120" font-size="13.5">Copy only what is</text>
<text class="m" x="200.0" y="139" font-size="13.5">known safe.</text>
<line x1="410.0" x2="510.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="380.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="380.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">3</text>
<text class="b" x="360.0" y="98" font-size="15.5">Render</text>
<text class="m" x="360.0" y="120" font-size="13.5">An animated terminal</text>
<text class="m" x="360.0" y="139" font-size="13.5">clip.</text>
<line x1="570.0" x2="670.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="540.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="540.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">4</text>
<text class="b" x="520.0" y="98" font-size="15.5">Pass 3 gates</text>
<text class="m" x="520.0" y="120" font-size="13.5">Text, layout, then</text>
<text class="m" x="520.0" y="139" font-size="13.5">OCR.</text>
<circle cx="700.0" cy="52" r="20" fill="#3A4AA8"/>
<text class="b" x="700.0" y="58" font-size="17" text-anchor="middle" style="fill:#FFFFFF">5</text>
<text class="b" x="680.0" y="98" font-size="15.5">Export</text>
<text class="m" x="680.0" y="120" font-size="13.5">Video plus contact</text>
<text class="m" x="680.0" y="139" font-size="13.5">sheet.</text>
</svg>
